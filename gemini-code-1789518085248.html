<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수행평가 관리 및 맞춤 알림</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>📝 수행평가 매니저</h1>

    <!-- D-3, D-1 알림 영역 -->
    <div id="notification-section" class="notification-box">
      <h2>🚨 D-3 / D-1 수행평가 알림</h2>
      <div id="notification-list"></div>
    </div>

    <!-- 수행평가 입력 폼 -->
    <div class="form-card">
      <h2>➕ 새 수행평가 등록</h2>
      <form id="assessment-form">
        <div class="form-group">
          <label for="subject">과목명</label>
          <input type="text" id="subject" placeholder="예: 수학, 영어" required>
        </div>

        <div class="form-group">
          <label for="title">수행평가 제목</label>
          <input type="text" id="title" placeholder="예: 서술형 평가, 자유 발표" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="period">교시</label>
            <input type="text" id="period" placeholder="예: 2교시" required>
          </div>

          <div class="form-group">
            <label for="confidence">자신감</label>
            <select id="confidence">
              <option value="😃 높음">😃 높음</option>
              <option value="🙂 보통" selected>🙂 보통</option>
              <option value="😨 낮음">😨 낮음</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="supplies">준비물</label>
          <input type="text" id="supplies" placeholder="예: 계산기, 대본, 필기구" required>
        </div>

        <div class="form-group">
          <label for="date">수행평가 날짜</label>
          <input type="date" id="date" required>
        </div>

        <button type="submit" class="btn-submit">수행평가 추가</button>
      </form>
    </div>

    <!-- 전체 등록 목록 -->
    <div class="list-section">
      <h2>📋 등록된 수행평가 목록</h2>
      <div id="assessment-list"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
