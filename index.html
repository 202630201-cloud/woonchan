<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수행평가 알리미</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- 헤더 영역 -->
    <header>
      <div class="logo-area">
        <h1>📢 수행평가 알리미</h1>
        <p>체계적인 일정 관리와 스마트한 우선순위 분석 서비스</p>
      </div>
    </header>

    <!-- 네비게이션 탭 -->
    <nav class="nav-tabs">
      <button class="tab-btn active" id="tab-register-btn" onclick="switchTab('register-tab')">
        <span class="icon">📝</span> STEP 1~3. 수행평가 등록
      </button>
      <button class="tab-btn" id="tab-list-btn" onclick="switchTab('list-tab')">
        <span class="icon">⏳</span> STEP 5. 실시간 수행평가 목록
      </button>
    </nav>

    <!-- TAB 1: 수행평가 등록 (STEP 1 ~ STEP 3) -->
    <section id="register-tab" class="tab-content active">
      <div class="card">
        <div class="card-header">
          <h2>📝 새로운 수행평가 등록하기</h2>
          <p>수행평가 정보, 준비물, 자신감을 입력하면 맞춤형 우선순위와 알림을 제공합니다.</p>
        </div>

        <form id="assessmentForm">
          <!-- STEP 1: 기본 정보 및 날짜/교시 -->
          <div class="step-box">
            <div class="step-title"><span class="step-badge">STEP 1</span> 공지된 수행평가 날짜와 교시 입력</div>
            <div class="form-grid">
              <div class="form-group">
                <label for="subject">과목명</label>
                <input type="text" id="subject" placeholder="예: 국어, 수학, 영어, 과학" required>
              </div>
              <div class="form-group">
                <label for="title">수행평가 제목</label>
                <input type="text" id="title" placeholder="예: 독서 감상문 발표, 실험 보고서" required>
              </div>
              <div class="form-group">
                <label for="date">평가 날짜</label>
                <input type="date" id="date" required>
              </div>
              <div class="form-group">
                <label for="period">평가 교시</label>
                <select id="period" required>
                  <option value="1교시">1교시</option>
                  <option value="2교시">2교시</option>
                  <option value="3교시">3교시</option>
                  <option value="4교시">4교시</option>
                  <option value="5교시">5교시</option>
                  <option value="6교시">6교시</option>
                  <option value="7교시">7교시</option>
                </select>
              </div>
            </div>
          </div>

          <!-- STEP 2: 필요한 준비물 입력 -->
          <div class="step-box">
            <div class="step-title"><span class="step-badge">STEP 2</span> 필요한 준비물 입력</div>
            <div class="form-group">
              <label for="supplies">준비물 및 지참물</label>
              <input type="text" id="supplies" placeholder="예: 필기구, 계산기, 실험 보고서 양식, 필독서" required>
            </div>
          </div>

          <!-- STEP 3: 자신감 입력 -->
          <div class="step-box">
            <div class="step-title"><span class="step-badge">STEP 3</span> 과목 자신감 입력 (1~10)</div>
            <div class="form-group">
              <div class="range-header">
                <label for="confidence">자신감 점수 (1점: 자신없음 ~ 10점: 완벽대비)</label>
                <span id="confidenceVal" class="confidence-badge">5점 (보통)</span>
              </div>
              <input type="range" id="confidence" min="1" max="10" value="5" oninput="updateConfidenceText(this.value)">
              <p class="form-help">* 자신 없는 과목(점수가 낮은 과목)일수록 우선순위가 높게 지정되어 목록 상단에 배치됩니다.</p>
            </div>
          </div>

          <button type="submit" class="btn-primary">수행평가 등록하기</button>
        </form>
      </div>
    </section>

    <!-- TAB 2: 수행평가 목록 및 실시간 타이머 (STEP 4, STEP 5) -->
    <section id="list-tab" class="tab-content">
      <div class="card">
        <div class="card-header flex-header">
          <div>
            <h2>⏳ 실시간 수행평가 목록 & D-Day</h2>
            <p>우선순위(남은 기간 + 취약 과목) 순으로 자동 정렬됩니다.</p>
          </div>
          <button class="btn-notif" onclick="requestNotificationPermission()">
            🔔 STEP 4. 브라우저 알림 설정
          </button>
        </div>

        <!-- 필터 및 정렬 옵션 -->
        <div class="filter-bar">
          <label for="sortBy">정렬 기준:</label>
          <select id="sortBy" onchange="renderList()">
            <option value="priority">🔥 스마트 우선순위 (마감임박 + 취약과목)</option>
            <option value="date">📅 마감일 빠른 순</option>
            <option value="confidence">⭐ 자신감 낮은 순 (취약과목 먼저)</option>
          </select>
        </div>

        <!-- 수행평가 목록 출력 컨테이너 -->
        <div id="assessmentList" class="assessment-container">
          <!-- script.js에서 동적으로 생성됩니다. -->
        </div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
